name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: alice
          POSTGRES_PASSWORD: alice
          POSTGRES_DB: alice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alice -d alice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The e2e suite runs migrations itself against the service containers.
      # OpenAI is never called: OPENAI_FAKE swaps in the in-memory provider.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: alice
          POSTGRES_PASSWORD: alice
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the production image
        run: docker build -t makealicebetter:ci .
